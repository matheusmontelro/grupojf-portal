# Declarative repository settings for the GitHub Settings app.
# These settings are applied only if https://github.com/apps/settings is installed.

repository:
  name: grupojf
  description: Sistema Grupo JF
  has_issues: true
  has_projects: false
  has_wiki: false
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - Backend
          - Frontend
      enforce_admins: false
      restrictions: null
